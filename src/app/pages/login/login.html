<div class="login-wrapper">
  <div class="login-card">
    
    <div class="logo-container">
      <img src="assets/logo-cens.png" alt="CENS - Grupo EPM" class="brand-logo" />
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <input 
        type="email" 
        pInputText 
        [(ngModel)]="email" 
        name="email" 
        placeholder="Correo Electrónico" 
        class="custom-input" />

      <input 
        type="password" 
        pInputText 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Contraseña" 
        class="custom-input" />

      <!-- Mensaje de error discreto si falla el login -->
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-entrar" [disabled]="loading">
        ENTRAR
      </button>
    </form>

  </div>
</div>
