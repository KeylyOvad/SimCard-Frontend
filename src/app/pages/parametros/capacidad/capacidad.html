<!-- Encabezado superior -->
<app-header></app-header>

<div class="page-container">
  <!-- Titulo principal de la pagina -->
  <header class="page-header">
    <h1>Gestión de Capacidades</h1>
    <p>Administración de capacidades para tarjetas SIM</p>
  </header>

  <!-- Tabla de capacidades -->
  <p-table
    #dt
    [value]="capacidades"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [globalFilterFields]="['descripcion']"
    [showGridlines]="true"
    styleClass="p-datatable-striped cens-card-table tabla-proporcionada"
  >
    <!-- Buscador y boton agregar -->
    <ng-template pTemplate="caption">
      <div class="table-header-actions">
        <!-- Campo de busqueda -->
        <p-iconfield iconPosition="left" class="search-field">
          <p-inputicon styleClass="pi pi-search"></p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar por descripción..."
            class="w-full"
          />
        </p-iconfield>

        <!-- Boton para abrir modal de agregar -->
        <p-button
          *ngIf="puedeModificar"
          label="Agregar Capacidad"
          icon="pi pi-plus"
          styleClass="btn-primary-cens"
          (onClick)="abrirModal()"
        ></p-button>
      </div>
    </ng-template>

    <!-- Titulos de las columnas -->
    <ng-template pTemplate="header">
      <tr>
        <th class="text-center col-id-capacidad">ID</th>
        <th pSortableColumn="descripcion" class="text-left col-descripcion-capacidad">
          Descripción <p-sortIcon field="descripcion"></p-sortIcon>
        </th>
        <th *ngIf="puedeModificar" class="text-center col-acciones-capacidad">Acciones</th>
      </tr>
    </ng-template>

    <!-- Filas de datos de la tabla -->
    <ng-template pTemplate="body" let-capacidad>
      <tr>
        <td class="text-center">{{ capacidad.id_capacidad }}</td>
        <td class="text-left"><strong>{{ capacidad.descripcion }}</strong></td>
        
        <!-- Botones de editar y eliminar -->
        <td *ngIf="puedeModificar" class="text-center">
          <div class="actions-wrapper">
            <button
              type="button"
              class="btn-action edit"
              title="Editar"
              (click)="editarCapacidad(capacidad)"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn-action delete"
              title="Eliminar"
              (click)="eliminarCapacidad(capacidad)"
            >
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Mensaje cuando la tabla esta vacia -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="puedeModificar ? 3 : 2" class="text-center p-4">
          No se encontraron capacidades registradas.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal emergente para agregar o editar -->
<p-dialog
  [(visible)]="modalAbierto"
  [modal]="true"
  styleClass="modal-custom-cens modal-capacidad"
  [draggable]="false"
  [resizable]="false"
  (onHide)="cerrarModal()"
>
  <!-- Encabezado del modal -->
  <ng-template pTemplate="header">
    <div class="modal-header-custom">
      <span class="icon">📦</span>
      <h3>{{ capacidadEditando ? 'Editar Capacidad' : 'Nueva Capacidad' }}</h3>
    </div>
  </ng-template>

  <!-- Formulario dentro del modal -->
  <form class="dialog-form" (ngSubmit)="guardarCapacidad()">
    <!-- Campo de descripcion -->
    <div class="field">
      <label for="descripcionCapacidad">Descripción *</label>
      <input 
        id="descripcionCapacidad"
        pInputText 
        type="text" 
        [(ngModel)]="nuevaCapacidad.descripcion" 
        name="descripcion" 
        placeholder="Ej: 128 KB, 500 MB..."
        class="w-full"
        required
      />
    </div>

    <!-- Botones de guardar y cancelar -->
    <div class="modal-footer-custom">
      <button type="submit" class="btn-guardar-custom">Guardar</button>
      <button type="button" class="btn-cancelar-custom" (click)="cerrarModal()">Cancelar</button>
    </div>
  </form>
</p-dialog>
