<app-header></app-header>

<div class="page-container">
  <header class="page-header">
    <h1>Gestión de Capacidades</h1>
    <p>Administración de capacidades para tarjetas SIM</p>
  </header>

  <p-table
    #dt
    [value]="capacidades"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [globalFilterFields]="['descripcion']"
    [showGridlines]="true"
    styleClass="p-datatable-striped cens-card-table tabla-proporcionada"
  >
    <!-- Buscador y Acciones -->
    <ng-template pTemplate="caption">
      <div class="table-header-actions">
        <p-iconfield iconPosition="left" class="search-field">
          <p-inputicon styleClass="pi pi-search"></p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar por descripción..."
            class="w-full"
          />
        </p-iconfield>

        <p-button
          *ngIf="puedeModificar"
          label="Agregar Capacidad"
          icon="pi pi-plus"
          styleClass="btn-primary-cens"
          (onClick)="abrirModal()"
        ></p-button>
      </div>
    </ng-template>

    <!-- Encabezado de Tabla -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%;" class="text-center">ID</th>
        <th pSortableColumn="descripcion" style="width: 60%;" class="text-left">
          Descripción <p-sortIcon field="descripcion"></p-sortIcon>
        </th>
        <th *ngIf="puedeModificar" style="width: 25%;" class="text-center">Acciones</th>
      </tr>
    </ng-template>

    <!-- Cuerpo de Tabla -->
    <ng-template pTemplate="body" let-capacidad>
      <tr>
        <td class="text-center">{{ capacidad.id_capacidad }}</td>
        <td class="text-left"><strong>{{ capacidad.descripcion }}</strong></td>
        
        <td *ngIf="puedeModificar" class="text-center">
          <div class="actions-wrapper">
            <button
              type="button"
              class="btn-action edit"
              title="Editar"
              (click)="editarCapacidad(capacidad)"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn-action delete"
              title="Eliminar"
              (click)="eliminarCapacidad(capacidad)"
            >
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Mensaje cuando está vacía -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="puedeModificar ? 3 : 2" class="text-center p-4">
          No se encontraron capacidades registradas.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal Dialog PrimeNG -->
<p-dialog
  [(visible)]="modalAbierto"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-custom-cens"
  (onHide)="cerrarModal()"
>
  <ng-template pTemplate="header">
    <div class="modal-header-custom">
      <span class="icon">📦</span>
      <h3>{{ capacidadEditando ? 'Editar Capacidad' : 'Nueva Capacidad' }}</h3>
    </div>
  </ng-template>

  <form class="dialog-form" (ngSubmit)="guardarCapacidad()">
    <div class="field">
      <label for="descripcionCapacidad">Descripción *</label>
      <input 
        id="descripcionCapacidad"
        pInputText 
        type="text" 
        [(ngModel)]="nuevaCapacidad.descripcion" 
        name="descripcion" 
        placeholder="Ej: 128 KB, 500 MB..."
        class="w-full"
        required
      />
    </div>

    <div class="modal-footer-custom">
      <button type="submit" class="btn-guardar-custom">Guardar</button>
      <button type="button" class="btn-cancelar-custom" (click)="cerrarModal()">Cancelar</button>
    </div>
  </form>
</p-dialog>
