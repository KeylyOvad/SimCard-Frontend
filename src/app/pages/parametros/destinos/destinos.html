<!-- Encabezado superior -->
<app-header></app-header>

<div class="page-container">
  <!-- Titulo principal de la pagina -->
  <header class="page-header">
    <h1>Gestión de Destinos</h1>
    <p>Administración de destinos de SIM Cards</p>
  </header>

  <!-- Tabla de destinos PrimeNG -->
  <p-table
    #dt
    [value]="destinos"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [globalFilterFields]="['descripcion']"
    [showGridlines]="true"
    styleClass="p-datatable-striped cens-card-table tabla-proporcionada"
  >
    <!-- Buscador y boton agregar -->
    <ng-template pTemplate="caption">
      <div class="table-header-actions">
        <!-- Campo de busqueda -->
        <p-iconfield iconPosition="left" class="search-field">
          <p-inputicon styleClass="pi pi-search"></p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar destino..."
            class="w-full"
          />
        </p-iconfield>

        <!-- Boton para agregar nuevo destino -->
        <p-button
          *ngIf="puedeModificar"
          label="Agregar Destino"
          icon="pi pi-plus"
          styleClass="btn-primary-cens"
          (onClick)="abrirModal()"
        ></p-button>
      </div>
    </ng-template>

    <!-- Titulos de las columnas -->
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%;" class="text-center">ID</th>
        <th pSortableColumn="descripcion" style="width: 60%;" class="text-left">
          Descripción <p-sortIcon field="descripcion"></p-sortIcon>
        </th>
        <th *ngIf="puedeModificar" style="width: 25%;" class="text-center">Acciones</th>
      </tr>
    </ng-template>

    <!-- Filas de datos de la tabla -->
    <ng-template pTemplate="body" let-dest let-rowIndex="rowIndex">
      <tr>
        <td class="text-center">{{ dest.id_destino || (rowIndex + 1) }}</td>
        <td class="text-left"><strong>{{ dest.descripcion }}</strong></td>
        
        <!-- Botones para editar y eliminar -->
        <td *ngIf="puedeModificar" class="text-center">
          <div class="actions-wrapper">
            <button
              type="button"
              class="btn-action edit"
              title="Editar"
              (click)="editarDestino(dest)"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn-action delete"
              title="Eliminar"
              (click)="eliminarDestino(dest)"
            >
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Mensaje cuando la tabla esta vacia -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="puedeModificar ? 3 : 2" class="p-4 text-center">
          No se encontraron destinos registrados.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal emergente para agregar o editar -->
<p-dialog
  [(visible)]="modalAbierto"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-custom-cens"
  (onHide)="cerrarModal()"
>
  <!-- Titulo del modal -->
  <ng-template pTemplate="header">
    <div class="modal-header-custom">
      <span class="icon">🌍</span>
      <h3>{{ destinoEditando ? 'Editar Destino' : 'Nuevo Destino' }}</h3>
    </div>
  </ng-template>

  <!-- Formulario del modal -->
  <form class="dialog-form" (ngSubmit)="guardarDestino()">
    <!-- Campo para la descripcion -->
    <div class="field">
      <label for="descripcionDestino">Descripción *</label>
      <input 
        id="descripcionDestino"
        pInputText 
        type="text" 
        [(ngModel)]="nuevoDestino.descripcion" 
        name="descripcion" 
        placeholder="Ej: Destino Bogotá, Red local..."
        class="w-full"
        required
      />
    </div>

    <!-- Botones de accion -->
    <div class="modal-footer-custom">
      <button type="submit" class="btn-guardar-custom">Guardar</button>
      <button type="button" class="btn-cancelar-custom" (click)="cerrarModal()">Cancelar</button>
    </div>
  </form>
</p-dialog>
