<app-header></app-header>

<div class="page-container">
  <header class="page-header">
    <h1>Gestión de Planes</h1>
    <p>Administración de planes de SIM Cards</p>
  </header>

  <!-- Tabla de planes PrimeNG -->
  <p-table
    #dt
    [value]="planes"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [globalFilterFields]="['descripcion']"
    [showGridlines]="true"
    styleClass="p-datatable-striped cens-card-table tabla-proporcionada"
  >
    <!-- Buscador + botón Agregar -->
    <ng-template pTemplate="caption">
      <div class="table-header-actions">
        <p-iconfield iconPosition="left" class="search-field">
          <p-inputicon styleClass="pi pi-search"></p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar plan..."
            class="w-full"
          />
        </p-iconfield>

        <p-button
          *ngIf="puedeModificar"
          label="Agregar Plan"
          icon="pi pi-plus"
          styleClass="btn-primary-cens"
          (onClick)="abrirModal()"
        ></p-button>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 15%;" class="text-center">ID</th>
        <th pSortableColumn="descripcion" style="width: 60%;" class="text-left">
          Descripción <p-sortIcon field="descripcion"></p-sortIcon>
        </th>
        <th *ngIf="puedeModificar" style="width: 25%;" class="text-center">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-plan let-rowIndex="rowIndex">
      <tr>
        <td class="text-center">{{ plan.id_plan || (rowIndex + 1) }}</td>
        <td class="text-left"><strong>{{ plan.descripcion }}</strong></td>
        
        <td *ngIf="puedeModificar" class="text-center">
          <div class="actions-wrapper">
            <button
              type="button"
              class="btn-action edit"
              title="Editar"
              (click)="editarPlan(plan)"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn-action delete"
              title="Eliminar"
              (click)="eliminarPlan(plan)"
            >
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="puedeModificar ? 3 : 2" class="p-4 text-center">
          No se encontraron planes registrados.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal Dialog PrimeNG -->
<p-dialog
  [(visible)]="modalAbierto"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-custom-cens"
  (onHide)="cerrarModal()"
>
  <ng-template pTemplate="header">
    <div class="modal-header-custom">
      <span class="icon">📋</span>
      <h3>{{ planEditando ? 'Editar Plan' : 'Nuevo Plan' }}</h3>
    </div>
  </ng-template>

  <form class="dialog-form" (ngSubmit)="guardarPlan()">
    <div class="field">
      <label for="descripcionPlan">Descripción *</label>
      <input 
        id="descripcionPlan"
        pInputText 
        type="text" 
        [(ngModel)]="nuevoPlan.descripcion" 
        name="descripcion" 
        placeholder="Ej: Plan Datos 5GB, Plan M2M..."
        class="w-full" 
        required
      />
    </div>

    <div class="modal-footer-custom">
      <button type="submit" class="btn-guardar-custom">Guardar</button>
      <button type="button" class="btn-cancelar-custom" (click)="cerrarModal()">Cancelar</button>
    </div>
  </form>
</p-dialog>
