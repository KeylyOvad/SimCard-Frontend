<!-- Encabezado superior -->
<app-header></app-header>

<div class="page-container">
  <!-- Titulo principal -->
  <header class="page-header">
    <h1>Gestión de Responsables</h1>
    <p>Administración de responsables</p>
  </header>

  <!-- Tabla de responsables PrimeNG -->
  <p-table
    #dt
    [value]="responsables"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 25]"
    [globalFilterFields]="['descripcion']"
    [showGridlines]="true"
    styleClass="p-datatable-striped cens-card-table tabla-proporcionada"
  >
    <!-- Buscador y boton agregar -->
    <ng-template pTemplate="caption">
      <div class="table-header-actions">
        <!-- Campo de busqueda -->
        <p-iconfield iconPosition="left" class="search-field">
          <p-inputicon styleClass="pi pi-search"></p-inputicon>
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            placeholder="Buscar responsable..."
            class="w-full"
          />
        </p-iconfield>

        <!-- Boton para agregar nuevo responsable -->
        <p-button
          *ngIf="puedeModificar"
          label="Agregar Responsable"
          icon="pi pi-plus"
          styleClass="btn-primary-cens"
          (onClick)="abrirModal()"
        ></p-button>
      </div>
    </ng-template>

    <!-- Titulos de las columnas -->
    <ng-template pTemplate="header">
  <tr>
    <th class="text-center col-id-responsable">ID</th>
       <th
      pSortableColumn="descripcion"
      class="text-left col-descripcion-responsable" >Descripción
      <p-sortIcon field="descripcion"></p-sortIcon>
    </th>
     <th *ngIf="puedeModificar" class="text-center col-acciones-responsable">
      Acciones
    </th>
  </tr>
</ng-template>

    <!-- Filas de datos de la tabla -->
    <ng-template pTemplate="body" let-resp let-rowIndex="rowIndex">
      <tr>
        <td class="text-center">{{ resp.id_responsable || (rowIndex + 1) }}</td>
        <td class="text-left"><strong>{{ resp.descripcion }}</strong></td>
        
        <!-- Botones para editar y eliminar -->
        <td *ngIf="puedeModificar" class="text-center">
          <div class="actions-wrapper">
            <button
              type="button"
              class="btn-action edit"
              title="Editar"
              (click)="editarResponsable(resp)"
            >
              <i class="pi pi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn-action delete"
              title="Eliminar"
              (click)="eliminarResponsable(resp)"
            >
              <i class="pi pi-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <!-- Mensaje cuando la tabla esta vacia -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="puedeModificar ? 3 : 2" class="p-4 text-center">
          No se encontraron responsables registrados.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Modal emergente para agregar o editar -->
<p-dialog
  [(visible)]="modalAbierto"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  styleClass="modal-custom-cens modal-responsable"
  (onHide)="cerrarModal()"
>
  <!-- Titulo del modal -->
  <ng-template pTemplate="header">
    <div class="modal-header-custom">
      <span class="icon">👤</span>
      <h3>{{ responsableEditando ? 'Editar Responsable' : 'Nuevo Responsable' }}</h3>
    </div>
  </ng-template>

  <!-- Formulario del modal -->
  <form class="dialog-form" (ngSubmit)="guardarResponsable()">
    <!-- Campo para la descripcion -->
    <div class="field">
      <label for="descripcionResponsable">Descripción *</label>
      <input 
        id="descripcionResponsable"
        pInputText 
        type="text" 
        [(ngModel)]="nuevoResponsable.descripcion" 
        name="descripcion" 
        placeholder="Ej: Juan Pérez, Área Mantenimiento..."
        class="w-full" 
        required
      />
    </div>

    <!-- Botones de accion -->
    <div class="modal-footer-custom">
      <button type="submit" class="btn-guardar-custom">Guardar</button>
      <button type="button" class="btn-cancelar-custom" (click)="cerrarModal()">Cancelar</button>
    </div>
  </form>
</p-dialog>
