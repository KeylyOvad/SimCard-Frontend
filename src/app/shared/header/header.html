<header class="top-bar">
  <div class="top-left">
    <img src="assets/logo-cens.png" alt="CENS" class="logo" />
    <nav>
      <a routerLink="/home" routerLinkActive="active">Inicio</a>
      <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
      <a routerLink="/parametros" routerLinkActive="active">Parámetros</a>
    </nav>
  </div>

  <div class="top-right">
    <div class="user-menu" (click)="toggleMenu()">
      <div class="avatar">
        {{ userName ? userName[0] : 'U' }}
      </div>

      <span class="user-name">{{ userName }}</span>
      <i class="pi pi-chevron-down arrow"></i>

      <!-- Dropdown personalizado con PrimeIcons -->
      <div *ngIf="menuOpen" class="dropdown" (click)="$event.stopPropagation()">
        <div class="logout-wrapper">
          <button type="button" class="custom-btn-logout" (click)="logout(); $event.stopPropagation()">
            <i class="pi pi-power-off"></i>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
